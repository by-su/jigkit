name: developer
title: 개발자
summary: 승인된 설계를 동작하는 코드로 옮기고, 검증 가능한 상태로 남긴다

# 이 단계가 읽어야 하는 선행 산출물. 없으면 기동 시 경고한다.
inputs:
  - docs/design/{slug}.md
  - docs/prd/{slug}.md

# 재작업 사이클에서 돌아오는 지적. 있으면 그것부터 처리한다.
inputs_optional:
  - docs/review/{slug}.md

# 이 단계가 쓸 수 있는 경로.
outputs:
  - src/**
  - tests/**
  - docs/decisions/{slug}.md

permissions:
  # 다른 단계의 산출물은 build 가 outputs 에서 자동 유도해 차단한다.
  # 여기에는 **아무 프로필도 소유하지 않는** 경로만 적는다 (예: .github/**).
  deny_write: []
  deny_read:
    - "**/.env"
    - "**/*.pem"

# 발견 단계 — 등록한 소스를 통째로 켜 두었다.
# 스킬 본문을 사람이 다 읽고 고를 수는 없으므로, 켜 놓고 `jig usage` 로 무엇이 실제로
# 불리는지 재고 나서 개별 id 로 좁힌다. 좁히는 것은 이 줄 한 줄을 고치는 일이다.
skills: ["anthropics/*", "obra/*", stack]
agents: []

# 이 단계가 실제로 쓰는 MCP 서버만. 카탈로그(library/stacks/)의 id 를 그대로 적는다 —
# `jig stack list` 로 고를 수 있는 것을 본다. 기본은 없음: 켜면 도구 정의가 매 세션 올라간다.
mcp: []

# 기동 토큰 상한. jig budget 이 실측해 대조한다.
# [M] 발견 단계라 등록 소스를 통째로 켜 두었다 — 스킬 18개에 실측 18,445 토큰.
# 스킬 0개 기준선도 이미 15,625 였다(상한이 그 사이 낡았다). probe/results/growth.md.
# jig usage 로 정리한 뒤 다시 내린다.
budget_tokens: 20000

# Claude Code 번들 스킬(dataviz, code-review, run …)을 로드할지.
# 기본 false — 켜면 스킬 설명 11개가 매 세션 컨텍스트에 올라온다 [M].
bundled_skills: false

done_when:
  - cmd: 전체 테스트 스위트를 이 세션에서 실제로 돌리고 결과를 붙인다
  - 변경된 동작이 테스트로 덮여 있다
  - 설계 문서와 어긋난 판단은 docs/decisions/{slug}.md 에 근거와 함께 기록됐다
  - 설계 문서에 대한 질문은 직접 고치지 않고 "앞 단계로 되돌릴 질문"으로 적혔다
