name: developer
title: 개발자
summary: 승인된 설계를 동작하는 코드로 옮기고, 검증 가능한 상태로 남긴다

# 이 단계가 읽어야 하는 선행 산출물. 없으면 기동 시 경고한다.
inputs:
  - docs/design/{slug}.md
  - docs/prd/{slug}.md

# 재작업 사이클에서 돌아오는 지적. 있으면 그것부터 처리한다.
inputs_optional:
  - docs/review/{slug}.md

# 이 단계가 쓸 수 있는 경로.
outputs:
  - src/**
  - tests/**
  - docs/decisions/{slug}.md

permissions:
  # 다른 단계의 산출물은 build 가 outputs 에서 자동 유도해 차단한다.
  # 여기에는 **아무 프로필도 소유하지 않는** 경로만 적는다 (예: .github/**).
  deny_write: []
  deny_read:
    - "**/.env"
    - "**/*.pem"

# P01·"측정 전에 최적화하지 않는다" — 빈 채로 시작한다.
# 실제로 반복된 작업만 스킬로 승격한다.
skills: []
agents: []

# 이 단계가 실제로 쓰는 MCP 서버만 (library/mcp/<id>.json). 기본은 없음.
mcp: []

# 기동 토큰 상한. jig budget 이 실측해 대조한다.
budget_tokens: 15000

# Claude Code 번들 스킬(dataviz, code-review, run …)을 로드할지.
# 기본 false — 켜면 스킬 설명 11개가 매 세션 컨텍스트에 올라온다 [M].
bundled_skills: false

done_when:
  - cmd: 전체 테스트 스위트를 이 세션에서 실제로 돌리고 결과를 붙인다
  - 변경된 동작이 테스트로 덮여 있다
  - 설계 문서와 어긋난 판단은 docs/decisions/{slug}.md 에 근거와 함께 기록됐다
  - 설계 문서에 대한 질문은 직접 고치지 않고 "앞 단계로 되돌릴 질문"으로 적혔다
