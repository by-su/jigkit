name: researcher
title: 리서처
summary: 판단에 필요한 사실을 모으고, 각 사실에 근거 등급을 붙인다

inputs: []
outputs:
  - docs/research/{slug}.md

permissions:
  # 다른 단계의 산출물은 build 가 outputs 에서 자동 유도해 차단한다.
  # 여기에는 **아무 프로필도 소유하지 않는** 경로만 적는다 (예: .github/**).
  deny_write: []
  deny_read:
    - "**/.env"
    - "**/*.pem"

# 발견 단계 — 등록한 소스를 통째로 켜 두었다.
# 스킬 본문을 사람이 다 읽고 고를 수는 없으므로, 켜 놓고 `jig usage` 로 무엇이 실제로
# 불리는지 재고 나서 개별 id 로 좁힌다. 좁히는 것은 이 줄 한 줄을 고치는 일이다.
skills: ["anthropics/*", "obra/*"]
agents: []
mcp: []

# 기동 토큰 상한. jig budget 이 실측해 대조한다.
# [M] 발견 단계라 등록 소스를 통째로 켜 두었다 — 스킬 18개에 실측 18,445 토큰.
# 스킬 0개 기준선도 이미 15,625 였다(상한이 그 사이 낡았다). probe/results/growth.md.
# jig usage 로 정리한 뒤 다시 내린다.
budget_tokens: 20000
bundled_skills: false

done_when:
  - 모든 주장에 근거 등급이 붙어 있다
  - 출처가 서로 충돌한 곳은 어느 쪽을 택했는지와 함께 적혀 있다
  - 확인 못 한 것은 [?] 로 남고, 무엇을 어떻게 확인하면 답이 나오는지 적혀 있다
  - 결론보다 근거가 길다
