name: reviewer
title: 리뷰어
summary: 만들어진 것이 앞 단계에서 약속한 것과 맞는지 확인하고, 어긋난 곳을 적는다

inputs:
  - docs/design/{slug}.md
  - docs/prd/{slug}.md

# 구현이 설계에서 이탈한 근거. 있으면 반드시 읽는다.
inputs_optional:
  - docs/decisions/{slug}.md
outputs:
  - docs/review/{slug}.md

permissions:
  # 다른 단계의 산출물은 build 가 outputs 에서 자동 유도해 차단한다.
  # 여기에는 **아무 프로필도 소유하지 않는** 경로만 적는다 (예: .github/**).
  deny_write: []
  deny_read:
    - "**/.env"
    - "**/*.pem"

# 발견 단계 — 등록한 소스를 통째로 켜 두었다.
# 스킬 본문을 사람이 다 읽고 고를 수는 없으므로, 켜 놓고 `jig usage` 로 무엇이 실제로
# 불리는지 재고 나서 개별 id 로 좁힌다. 좁히는 것은 이 줄 한 줄을 고치는 일이다.
skills: ["anthropics/*", "obra/*"]
agents: []
# 이 단계가 실제로 쓰는 MCP 서버만. 카탈로그(library/stacks/)의 id 를 그대로 적는다 —
# `jig stack list` 로 고를 수 있는 것을 본다. 기본은 없음: 켜면 도구 정의가 매 세션 올라간다.
mcp: []

# 기동 토큰 상한. jig budget 이 실측해 대조한다.
# [M] 발견 단계라 등록 소스를 통째로 켜 두었다 — 스킬 18개에 실측 18,445 토큰.
# 스킬 0개 기준선도 이미 15,625 였다(상한이 그 사이 낡았다). probe/results/growth.md.
# jig usage 로 정리한 뒤 다시 내린다.
budget_tokens: 20000
bundled_skills: false

done_when:
  - cmd: 테스트 스위트를 실제로 돌리고 결과를 붙인다
  - 지적마다 근거(파일·줄 또는 실행 결과)가 붙어 있다
  - 설계와 어긋난 곳이 "구현이 틀림 / 설계가 틀림 / 의도된 이탈" 중 무엇인지 판정돼 있다
  - 고치지 않았다 — 무엇을 어떻게 고칠지만 적었다
