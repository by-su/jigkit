# golden 픽스처. **프로필이 아니다.**
#
# `_` 로 시작하므로 discover() 가 건너뛴다 — jig list·build·doctor 에 안 나온다.
# jig golden 만 명시적으로 집어서 컴파일한다.
#
# 존재 이유: `agents:` · `mcp:` · 로컬 `skills:` 세 분기는 컴파일러에 구현돼 있지만
# **한 번도 실행된 적이 없었다.** 실제 프로필이 전부 빈 목록이고 golden 에도 커버리지가
# 없어서, 동작하는 것처럼 보이지만 검증된 적 없는 코드였다. 같은 상태였던 `skills:` 는
# 실제로 쓰려는 순간에야 문제가 드러났다. 이 픽스처가 세 경로를 매 golden 실행마다
# 지나가게 한다.
name: _fixture
title: 픽스처
summary: 컴파일러 분기 커버리지용. 실제 작업에 쓰지 않는다

inputs: []

outputs:
  - docs/_fixture/{slug}.md

permissions:
  deny_write: []
  deny_read:
    - "**/.env"

# 네임스페이스 없는 id = library/skills/ 의 로컬 스킬
skills: [example]
agents: [example]
mcp: [example]

bundled_skills: false

done_when:
  - 이 프로필은 실행용이 아니다
