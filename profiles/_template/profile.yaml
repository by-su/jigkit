name: CHANGEME
title: CHANGEME
summary: 한 줄 — 이 단계가 책임지는 것

# 이 단계가 읽어야 하는 선행 산출물. 없으면 기동 시 경고한다.
inputs: []

# 이 단계가 쓸 수 있는 경로.
outputs:
  - docs/CHANGEME/{slug}.md

permissions:
  # 앞 단계 산출물은 입력이지 작업 대상이 아니다 (P08).
  # 어댑터가 Edit(...) 로 컴파일한다 — Write(...) 는 차단되지 않는다 [M].
  deny_write: []
  deny_read:
    - "**/.env"
    - "**/*.pem"

# 등록된 소스에서 id 로 켜거나(`anthropics/pdf`) 글롭으로 통째 켠다(`anthropics/*`).
# `jig skills` 로 목록과 비용을, `jig usage` 로 실제 호출을 본다.
skills: []
agents: []

# 카탈로그(library/stacks/)의 id 를 그대로 적는다 — `jig stack list` 로 고를 수 있는 것을 본다.
# 기본은 없음: 켜면 도구 정의가 매 세션 컨텍스트에 올라간다.
mcp: []

bundled_skills: false

done_when:
  - 산출물이 정해진 경로에 채워졌다
